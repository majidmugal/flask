{% extends "base.html" %} {% block title %} Movie App {% endblock %} {% block
content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-4">Add a movie</h3>

        <form method="POST" action="/add_movie">
          <!-- Title -->
          <div class="mb-3">
            <label for="title" class="form-label">Movie Name</label>
            <input
              type="text"
              class="form-control"
              id="title"
              name="name"
              placeholder="Enter movie"
              required
            />
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea
              class="form-control"
              id="description"
              name="description"
              rows="6"
              placeholder="Write your post here..."
              required
            ></textarea>
          </div>
          <div class="mb-3">
            <label for="title" class="form-label">Rating</label>
            <input
              type="text"
              class="form-control"
              id="title"
              name="rating"
              placeholder="Movie rating"
              required
            />
          </div>
          <div class="mb-3">
            <label for="title" class="form-label">Duration</label>
            <input
              type="text"
              class="form-control"
              id="title"
              name="duration"
              placeholder="Duration"
              required
            />
          </div>

          <!-- Submit -->
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Publish</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
