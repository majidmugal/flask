{% extends 'base.html' %}

{% block title %}

<title>List Students</title>
{% endblock %}


{% block content %}
<section class="hero">
    <h1>students list</h1>

    {% for x in fe_data %}

        <p><strong>Full Name:</strong>{{x.name}}</p>
        <p><strong>Email:</strong>{{x.email}}</p>
         <p><strong>Collage:</strong>{{x.Collage}}</p>
        <p><strong>Password:</strong>{{x.password}}</p>
        <p><strong>Confirm Password:</strong>{{x.confirm_password}}</p>

    <br>
    <br>
    <br>
    <br>

    {% endfor %}

</section>


{% endblock%}
