{% extends 'base.html' %} {% block title %} show blog data {% endblock %} {%
block content %}

<div class="container mt-5">
  <h2 class="text-center mb-5 text-primary fw-bold">Blog Posts</h2>

  <div class="row">
    {% for x in data %}

    <div class="col-md-4 mb-4">
      <div class="card shadow-lg border-0 rounded-4 h-100">
        <div class="card-body d-flex flex-column">
          <h4 class="card-title text-dark fw-bold mb-3">{{ x.title }}</h4>

          <p class="text-muted"><strong>ID:</strong> {{ x.id }}</p>

          <p class="card-text text-secondary">{{ x.description }}</p>

          <div class="mt-auto d-flex gap-2">
            <a href="/display/{{x.id}}" class="btn btn-primary w-50"> Read </a>

            <a href="/update_blog/{{x.id}}" class="btn btn-primary w-50"
              >update</a
            >

            <a href="/delete/{{x.id}}" class="btn btn-danger w-50"> Delete </a>
          </div>
        </div>
      </div>
    </div>

    {% endfor %}
  </div>
</div>

{% endblock %}
